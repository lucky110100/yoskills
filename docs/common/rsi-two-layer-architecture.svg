<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="100%" role="img">
  <title>RSI 两层架构职责边界</title>
  <desc>jiuwenswarm 服务域与 agent-core 引擎层的功能划分，通过 Provider Protocol 解耦</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t{font:13px sans-serif;fill:#2C2C2A}
      .ts{font:12px sans-serif;fill:#5F5E5A}
      .th{font:14px sans-serif;font-weight:500;fill:#2C2C2A}
      .tcap{font:11px sans-serif;fill:#888780}
    </style>
  </defs>

  <rect x="40" y="20" width="600" height="220" rx="16" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="th" x="56" y="44" dominant-baseline="central">jiuwenswarm 服务域（控制面）</text>
  <text class="tcap" x="56" y="60" dominant-baseline="central">面向用户 · HTTP/WebSocket · 18 个 rsi.* method</text>

  <g class="c-purple">
    <rect x="56" y="76" width="165" height="56" rx="8" fill="#CECBF6" stroke="#7F77DD" stroke-width="0.5"/>
    <text class="th" x="138" y="96" text-anchor="middle" dominant-baseline="central">Web API 层</text>
    <text class="ts" x="138" y="114" text-anchor="middle" dominant-baseline="central">rsi_handlers.py · 18 method</text>
  </g>

  <g class="c-purple">
    <rect x="237" y="76" width="165" height="56" rx="8" fill="#CECBF6" stroke="#7F77DD" stroke-width="0.5"/>
    <text class="th" x="319" y="96" text-anchor="middle" dominant-baseline="central">任务生命周期</text>
    <text class="ts" x="319" y="114" text-anchor="middle" dominant-baseline="central">task_store · 状态机</text>
  </g>

  <g class="c-purple">
    <rect x="418" y="76" width="165" height="56" rx="8" fill="#CECBF6" stroke="#7F77DD" stroke-width="0.5"/>
    <text class="th" x="500" y="96" text-anchor="middle" dominant-baseline="central">并发控制</text>
    <text class="ts" x="500" y="114" text-anchor="middle" dominant-baseline="central">worker · 单队列 N=1</text>
  </g>

  <g class="c-purple">
    <rect x="56" y="148" width="165" height="56" rx="8" fill="#CECBF6" stroke="#7F77DD" stroke-width="0.5"/>
    <text class="th" x="138" y="168" text-anchor="middle" dominant-baseline="central">数据集归一化</text>
    <text class="ts" x="138" y="186" text-anchor="middle" dominant-baseline="central">validation_dataset</text>
  </g>

  <g class="c-purple">
    <rect x="237" y="148" width="165" height="56" rx="8" fill="#CECBF6" stroke="#7F77DD" stroke-width="0.5"/>
    <text class="th" x="319" y="168" text-anchor="middle" dominant-baseline="central">输入冻结 + sha256</text>
    <text class="ts" x="319" y="186" text-anchor="middle" dominant-baseline="central">materializer.py</text>
  </g>

  <g class="c-purple">
    <rect x="418" y="148" width="165" height="56" rx="8" fill="#CECBF6" stroke="#7F77DD" stroke-width="0.5"/>
    <text class="th" x="500" y="168" text-anchor="middle" dominant-baseline="central">进度/树投影</text>
    <text class="ts" x="500" y="186" text-anchor="middle" dominant-baseline="central">projector · event_consumer</text>
  </g>

  <rect x="40" y="280" width="600" height="220" rx="16" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text class="th" x="56" y="304" dominant-baseline="central">agent-core 引擎层（执行面）</text>
  <text class="tcap" x="56" y="320" dominant-baseline="central">纯 Python 库 · 无 HTTP 依赖 · 通过 Provider Protocol 被调用</text>

  <g class="c-teal">
    <rect x="56" y="336" width="165" height="56" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
    <text class="th" x="138" y="356" text-anchor="middle" dominant-baseline="central">评测器</text>
    <text class="ts" x="138" y="374" text-anchor="middle" dominant-baseline="central">evaluator/ · 真跑 harness</text>
  </g>

  <g class="c-teal">
    <rect x="237" y="336" width="165" height="56" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
    <text class="th" x="319" y="356" text-anchor="middle" dominant-baseline="central">归因 + 规划</text>
    <text class="ts" x="319" y="374" text-anchor="middle" dominant-baseline="central">member_optimizer/</text>
  </g>

  <g class="c-teal">
    <rect x="418" y="336" width="165" height="56" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
    <text class="th" x="500" y="356" text-anchor="middle" dominant-baseline="central">晋级门禁</text>
    <text class="ts" x="500" y="374" text-anchor="middle" dominant-baseline="central">promotion_policy</text>
  </g>

  <g class="c-teal">
    <rect x="56" y="408" width="165" height="56" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
    <text class="th" x="138" y="428" text-anchor="middle" dominant-baseline="central">编排器</text>
    <text class="ts" x="138" y="446" text-anchor="middle" dominant-baseline="central">iterative.py · 4554行</text>
  </g>

  <g class="c-teal">
    <rect x="237" y="408" width="165" height="56" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
    <text class="th" x="319" y="428" text-anchor="middle" dominant-baseline="central">数据加载</text>
    <text class="ts" x="319" y="446" text-anchor="middle" dominant-baseline="central">data_loader/</text>
  </g>

  <g class="c-teal">
    <rect x="418" y="408" width="165" height="56" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
    <text class="th" x="500" y="428" text-anchor="middle" dominant-baseline="central">worktree 执行</text>
    <text class="ts" x="500" y="446" text-anchor="middle" dominant-baseline="central">worktree_coordinator</text>
  </g>

  <line x1="340" y1="246" x2="340" y2="272" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="250" y="250" width="180" height="20" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="tcap" x="340" y="260" text-anchor="middle" dominant-baseline="central">Provider Protocol (run/resume/read_state)</text>
</svg>
